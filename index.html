<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>⚡ پنل اختصاصی گیم و وبگردی | 10000GB</title>
<style>
:root{--accent:#10b981;--accent2:#3b82f6;--card:rgba(15,23,42,0.95);--text:#e2e8f0;--muted:#94a3b8;--border:#10b98155}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:var(--text);min-height:100vh;line-height:1.65;padding:14px}
.wrap{max-width:780px;margin:0 auto}
header{text-align:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;box-shadow:0 0 20px rgba(16,185,129,0.15)}
header h1{font-size:1.4rem;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border:1px solid var(--accent);border-radius:999px;font-size:0.75rem;color:#34d399;background:rgba(16,185,129,0.1)}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.nav button{padding:10px 16px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer;font-weight:700;font-size:0.88rem;font-family:inherit;transition:0.2s}
.nav button.active,.nav button:hover{background:linear-gradient(135deg,#10b98133,#3b82f628);border-color:var(--accent)}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:1.05rem;color:#34d399;margin-bottom:10px}
label{display:block;font-size:0.82rem;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:10px;background:#090d16;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.95rem}
textarea{min-height:70px;font-family:monospace;font-size:0.75rem;direction:ltr;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{padding:11px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;margin:3px;display:inline-flex;align-items:center;gap:5px;transition:0.2s}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-d{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#fca5a5}
.btn-s{background:rgba(34,197,94,0.15);border:1px solid #22c55e;color:#86efac}
.btn-w{background:rgba(245,158,11,0.15);border:1px solid #f59e0b;color:#fcd34d}
.btn-g{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}
.cfg{background:rgba(15,23,42,0.8);border-radius:12px;padding:12px;margin:10px 0;border:1px solid rgba(255,255,255,0.08)}
.cfg strong{color:#34d399}
.meta{font-size:0.84rem;color:var(--muted);line-height:1.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:99;opacity:0;transition:0.3s;font-weight:600;max-width:90%;text-align:center;box-shadow:0 0 15px rgba(0,0,0,0.5)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.quota{height:10px;border-radius:999px;background:#090d16;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,0.08)}
.quota>div{height:100%;border-radius:999px;transition:0.4s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚡ پنل اختصاصی گیم و وبگردی</h1>
    <p style="color:var(--muted);margin-top:6px;font-size:0.9rem">سرور پرسرعت s15.nahagebad.net | حجم کل: ۱۰,۰۰۰ گیگابایت</p>
    <span class="badge">WireGuard High-Speed Panel</span>
  </header>

  <div class="nav">
    <button type="button" class="active" data-tab="dash">📊 داشبورد</button>
    <button type="button" data-tab="create">➕ ساخت کانفیگ</button>
    <button type="button" data-tab="configs">📂 کانفیگ‌ها</button>
    <button type="button" data-tab="sub">🔗 لینک ساب</button>
  </div>

  <div id="tab-dash" class="tab active">
    <div class="card">
      <h2>📊 وضعیت مصرف پنل</h2>
      <div class="meta" id="statusMeta">...</div>
      <div class="quota"><div id="quotaFill" style="width:0%"></div></div>
      <div id="dashList" style="margin-top:12px"></div>
    </div>
  </div>

  <div id="tab-create" class="tab">
    <div class="card">
      <h2>🎮 ساخت کانفیگ جدید</h2>
      <div class="row">
        <div><label>روز اعتبار</label><input type="number" id="cfgDays" min="1" max="365" value="30"/></div>
        <div><label>تعداد کاربر</label><input type="number" id="cfgUsers" min="1" max="50" value="1"/></div>
        <div><label>حجم (گیگ)</label><input type="number" id="cfgGB" min="1" max="5000" value="200"/></div>
      </div>
      <label>نام کانفیگ (اختیاری)</label>
      <input type="text" id="cfgName" placeholder="مثلاً: گیمینگ خفن"/>
      <div style="margin-top:12px"><button type="button" class="btn btn-p" id="btnCreate">✨ ساخت و دانلود فایل .conf</button></div>
    </div>
  </div>

  <div id="tab-configs" class="tab">
    <div class="card">
      <h2>📂 کانفیگ‌های ساخته‌شده</h2>
      <div id="cfgList"></div>
    </div>
  </div>

  <div id="tab-sub" class="tab">
    <div class="card">
      <h2>🔗 لینک ساب‌اسکریپشن</h2>
      <p class="meta">کپی لینک ساب برای استفاده در نرم‌افزارهای مختلف.</p>
      <label>لینک ساب‌اسکریپشن</label>
      <input type="text" id="subHttps" readonly placeholder="هنوز لینکی ساخته نشده" style="direction:ltr;text-align:left;color:#86efac;font-family:monospace;font-size:0.85rem"/>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
        <button type="button" class="btn btn-p" id="btnSubLatest">🚀 لینک آخرین کانفیگ</button>
        <button type="button" class="btn btn-g" id="btnSubAll">📦 لینک همه فعال‌ها</button>
        <button type="button" class="btn btn-o" id="btnCopySub">📋 کپی لینک</button>
        <button type="button" class="btn btn-o" id="btnCopyB64">📋 کپی Base64</button>
      </div>
      <div id="subCfgList" style="margin-top:14px"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var PANEL = { totalGB: 10000, endpoint: "s15.nahagebad.net:4653" };
  var SERVER_PUBLIC_KEY = "76qSLzpNLBRmM3H2aoWC+Wk7jokw";
  var SOURCE_PRIVATE_KEY = "G0SSrssOWpmCx1maky06NI/SNP1omak...="; // کلید تصحیح شده
  var SOURCE_ADDRESS = "192.168.1.118/32";
  var SOURCE_DNS = "1.1.1.1";
  var SOURCE_KEEPALIVE = 25;

  var STORAGE_KEY = "wg_custom_panel_10000gb_v2";
  var CONFIGS = [];
  var CONSUMED = 0;
  var LAST_SUB_URL = "";

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 3000);
  }

  function switchTab(id) {
    document.querySelectorAll(".nav button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === id);
    });
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
    var el = document.getElementById("tab-" + id);
    if (el) el.classList.add("active");
    if (id === "dash") renderDash();
    if (id === "configs") renderList();
    if (id === "sub") renderSub();
  }

  document.querySelectorAll(".nav button").forEach(function(btn){
    btn.addEventListener("click", function(){ switchTab(btn.getAttribute("data-tab")); });
  });

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        CONFIGS = o.configs || [];
        CONSUMED = Number(o.consumedGB) || 0;
        LAST_SUB_URL = o.httpsSubUrl || "";
      } else {
        CONFIGS = [];
        CONSUMED = 0;
        save();
      }
    } catch (e) { CONFIGS = []; CONSUMED = 0; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ configs: CONFIGS, consumedGB: CONSUMED, httpsSubUrl: LAST_SUB_URL }));
  }

  function remainingDays(cfg) {
    if (!cfg) return 0;
    var endMs = null;
    if (cfg.expiresAt) endMs = new Date(cfg.expiresAt).getTime();
    else if (cfg.createdAt && cfg.days) endMs = new Date(cfg.createdAt).getTime() + (Number(cfg.days)||0)*86400000;
    else return Number(cfg.days)||0;
    var left = Math.ceil((endMs - Date.now()) / 86400000);
    return left > 0 ? left : 0;
  }
  function isActive(cfg) {
    if (!cfg || cfg.inSub === false) return false;
    if (remainingDays(cfg) <= 0) return false;
    return Math.max(0, (Number(cfg.gb)||0) - (Number(cfg.usedGB)||0)) > 0;
  }

  function buildConf(name, days, gb) {
    var safe = String(name).replace(/[^\x20-\x7E]/g,"_").slice(0,40);
    var conf = [
      "# Name = " + safe,
      "# High-Speed Game & Web Config",
      "[Interface]",
      "PrivateKey = " + SOURCE_PRIVATE_KEY,
      "Address = " + SOURCE_ADDRESS,
      "DNS = " + SOURCE_DNS,
      "",
      "[Peer]",
      "PublicKey = " + SERVER_PUBLIC_KEY,
      "AllowedIPs = 0.0.0.0/0",
      "Endpoint = " + PANEL.endpoint,
      "PersistentKeepalive = " + SOURCE_KEEPALIVE,
      ""
    ].join("\n");
    return { conf: conf };
  }

  function downloadText(text, filename) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){ toast("✅ کپی شد"); }).catch(function(){ fallback(text); });
    else fallback(text);
  }
  function fallback(text) {
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("✅ کپی شد"); } catch(e) { toast("❌ کپی نشد"); }
    document.body.removeChild(ta);
  }

  function updateStatus() {
    var total = PANEL.totalGB;
    var used = Math.max(0, Number(CONSUMED)||0);
    var rem = Math.max(0, total - used);
    var act = CONFIGS.filter(isActive).length;
    document.getElementById("statusMeta").innerHTML =
      "سرور: <code>s15.nahagebad.net:4653</code><br>"+
      "مصرف کل: <strong style='color:#86efac'>"+used+"</strong> / "+total+" GB — باقیمانده: <strong>"+rem+"</strong> GB<br>"+
      "کانفیگ‌های فعال: <strong>"+act+"</strong> / "+CONFIGS.length;
    var pct = Math.min(100, Math.round((used/total)*100));
    var fill = document.getElementById("quotaFill");
    fill.style.width = pct+"%";
    fill.style.background = pct>=95?"#ef4444":pct>=70?"#f59e0b":"#10b981";
  }

  function cfgButtons(cfg, i, on) {
    return '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">'+
      '<button type="button" class="btn '+(cfg.inSub!==false?"btn-d":"btn-s")+'" data-a="toggle" data-i="'+i+'">'+(cfg.inSub!==false?"🔴 غیرفعال":"🟢 فعال")+'</button>'+
      '<button type="button" class="btn btn-p" data-a="dl" data-i="'+i+'"'+(on?"":" disabled")+'>⬇️ دانلود .conf</button>'+
      '<button type="button" class="btn btn-o" data-a="copy" data-i="'+i+'"'+(on?"":" disabled")+'>📋 کپی</button>'+
      '<button type="button" class="btn btn-o" data-a="qr" data-i="'+i+'"'+(on?"":" disabled")+'>📱 QR Code</button>'+
      '<button type="button" class="btn btn-d" data-a="del" data-i="'+i+'">🗑️ حذف</button></div>';
  }

  function renderList() {
    updateStatus();
    var list = document.getElementById("cfgList");
    if (!CONFIGS.length) { list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:16px">هنوز کانفیگی ساخته نشده است</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      var left = remainingDays(cfg);
      html += '<div class="cfg" style="opacity:'+(on?1:0.55)+'"><strong>🎮 '+(cfg.name||("#"+(i+1)))+'</strong> <span style="font-size:0.75rem;color:'+(on?"#86efac":"#fca5a5")+'">● '+(on?"فعال":"غیرفعال")+'</span><br>'+
        '<span style="font-size:0.82rem;color:var(--muted)">'+(cfg.days||0)+' روزه • باقیمانده: '+left+' روز • حجم: '+(cfg.gb||0)+' گیگ</span>'+cfgButtons(cfg,i,on)+'</div>';
    });
    list.innerHTML = html;
  }

  function renderDash() {
    updateStatus();
    var box = document.getElementById("dashList");
    if (!CONFIGS.length) { box.innerHTML = '<p style="color:var(--muted)">کانفیگی موجود نیست.</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      html += '<div class="cfg"><strong>'+(cfg.name||("#"+(i+1)))+'</strong> — '+(on?"فعال":"غیرفعال")+' | '+(cfg.gb||0)+'GB</div>';
    });
    box.innerHTML = html;
  }

  function renderSub() {
    updateStatus();
    var box = document.getElementById("subCfgList");
    if (!CONFIGS.length) { box.innerHTML = '<p style="color:var(--muted)">ابتدا از تب ساخت کانفیگ یک مورد ایجاد کنید</p>'; return; }
    var html = '<strong style="color:#34d399;font-size:0.9rem">کانفیگ‌های آماده برای لینک ساب:</strong>';
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      html += '<div class="cfg"><div style="display:flex;justify-content:space-between;align-items:center">'+
        '<span>'+(cfg.name||("#"+(i+1)))+' — <span style="color:'+(on?"#86efac":"#fca5a5")+'">'+(on?"فعال":"غیرفعال")+'</span></span>'+
        '<button type="button" class="btn btn-g" data-a="sub" data-i="'+i+'">🔗 کپی ساب Base64</button></div></div>';
    });
    box.innerHTML = html;
  }

  function createConfig() {
    var total = PANEL.totalGB;
    var rem = Math.max(0, total - (Number(CONSUMED)||0));
    if (rem <= 0) { toast("⛔ حجم کل پنل تمام شده است"); return; }
    var days = parseInt(document.getElementById("cfgDays").value,10)||30;
    var gb = parseInt(document.getElementById("cfgGB").value,10)||200;
    if (gb > rem) gb = rem;
    var name = (document.getElementById("cfgName").value||"").trim();
    if (!name) name = "گیمینگ-وب-"+days+"روزه-"+gb+"گیگ";
    var built = buildConf(name, days, gb);
    CONFIGS.unshift({
      id: "cfg_"+Date.now().toString(36), name:name, days:days, gb:gb, usedGB:0,
      confText: built.conf, createdAt: new Date().toISOString(), expiresAt: new Date(Date.now()+days*86400000).toISOString(), inSub: true
    });
    CONSUMED += gb;
    save();
    renderAll();
    downloadText(built.conf, name.replace(/\s+/g,"_")+".conf");
    toast("✅ کانفیگ با موفقیت ساخته و دانلود شد");
    document.getElementById("cfgName").value = "";
    switchTab("configs");
  }

  function handleAction(a, i) {
    var cfg = CONFIGS[i];
    if (!cfg) return;
    if (a === "dl") {
      downloadText(cfg.confText, (cfg.name||"config").replace(/\s+/g,"_")+".conf");
    } else if (a === "copy") {
      copyText(cfg.confText||"");
    } else if (a === "qr") {
      window.open("https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent((cfg.confText||"").slice(0,1200)), "_blank");
    } else if (a === "toggle") {
      cfg.inSub = !(cfg.inSub !== false);
      save(); renderAll();
    } else if (a === "del") {
      if (!confirm("آیا از حذف این کانفیگ مطمئن هستید؟")) return;
      CONFIGS.splice(i,1); save(); renderAll(); toast("🗑️ حذف شد");
    } else if (a === "sub") {
      var b64 = btoa(unescape(encodeURIComponent(cfg.confText)));
      copyText("data:text/plain;base64," + b64);
      toast("✅ لینک ساب Base64 کپی شد");
    }
  }

  function renderAll() { renderList(); renderDash(); renderSub(); updateStatus(); }

  document.getElementById("btnCreate").addEventListener("click", createConfig);
  document.getElementById("btnSubLatest").addEventListener("click", function(){ if(CONFIGS.length) handleAction("sub", 0); else toast("کانفیگی وجود ندارد"); });
  document.getElementById("btnSubAll").addEventListener("click", function(){
    var list = CONFIGS.filter(isActive);
    if (!list.length) { toast("کانفیگ فعالی وجود ندارد"); return; }
    var body = list.map(function(c){ return c.confText; }).join("\n\n");
    copyText(btoa(unescape(encodeURIComponent(body))));
    toast("✅ ساب همه کانفیگ‌ها کپی شد");
  });
  document.getElementById("btnCopySub").addEventListener("click", function(){
    if(CONFIGS.length) handleAction("sub", 0); else toast("کانفیگی وجود ندارد");
  });
  document.getElementById("btnCopyB64").addEventListener("click", function(){
    var list = CONFIGS.filter(isActive);
    if (!list.length) { toast("کانفیگ فعالی وجود ندارد"); return; }
    var body = list.map(function(c){ return c.confText; }).join("\n\n");
    copyText(btoa(unescape(encodeURIComponent(body))));
  });

  document.body.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-a]");
    if (!btn || btn.disabled) return;
    var a = btn.getAttribute("data-a");
    var i = parseInt(btn.getAttribute("data-i"), 10);
    handleAction(a, i);
  });

  load();
  renderAll();
  toast("⚡ پنل ۱۰,۰۰۰ گیگابایتی آماده است!");
})();
</script>
</body>
</html>
