<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>پنل 🇹🇷 ترکیه (استانبول) | ZAKI GAMING</title>
<style>
:root{--accent:#f59e0b;--accent2:#ec4899;--card:rgba(15,23,42,0.95);--text:#e2e8f0;--muted:#94a3b8;--border:#f59e0b55}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:var(--text);min-height:100vh;line-height:1.65;padding:14px}
.wrap{max-width:780px;margin:0 auto}
header{text-align:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:12px}
header h1{font-size:1.3rem;background:linear-gradient(90deg,var(--accent),#60a5fa,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border:1px solid var(--accent);border-radius:999px;font-size:0.75rem;color:var(--accent)}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.nav button{padding:10px 16px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer;font-weight:700;font-size:0.88rem;font-family:inherit}
.nav button.active,.nav button:hover{background:linear-gradient(135deg,#f59e0b33,#ec489928);border-color:var(--accent)}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:1.05rem;color:var(--accent);margin-bottom:10px}
label{display:block;font-size:0.82rem;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:10px;background:#020617;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.95rem}
textarea{min-height:70px;font-family:monospace;font-size:0.75rem;direction:ltr;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{padding:11px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;margin:3px;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#020617}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-d{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#fca5a5}
.btn-s{background:rgba(34,197,94,0.15);border:1px solid #22c55e;color:#86efac}
.btn-g{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.cfg{background:rgba(2,6,23,0.8);border-radius:12px;padding:12px;margin:10px 0;border:1px solid rgba(255,255,255,0.08)}
.cfg strong{color:var(--accent)}
.meta{font-size:0.84rem;color:var(--muted);line-height:1.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#020617;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:99;opacity:0;transition:0.3s;font-weight:600;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.quota{height:8px;border-radius:999px;background:#0f172a;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,0.08)}
.quota>div{height:100%;border-radius:999px}
.owner{color:#f472b6;font-size:0.85rem;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🇹🇷 پنل گیمینگ 𖤍 ZAKI GAMING</h1>
    <p style="color:var(--muted);margin-top:6px;font-size:0.9rem">سرور ترکیه (استانبول) | پینگ فوق‌العاده پایین | ظرفیت کل: ۵۰۰ گیگابایت</p>
    <span class="badge">REG-TR-MVWBXCVY-W4JJ9K6Z</span>
  </header>

  <div class="nav">
    <button type="button" class="active" data-tab="dash">📊 داشبورد</button>
    <button type="button" data-tab="create">➕ ساخت کانفیگ گیمینگ</button>
    <button type="button" data-tab="configs">📂 کانفیگ‌ها</button>
    <button type="button" data-tab="sub">🔗 لینک ساب</button>
  </div>

  <div id="tab-dash" class="tab active">
    <div class="card">
      <h2>📊 وضعیت کل پنل</h2>
      <div class="meta" id="statusMeta">...</div>
      <div class="quota"><div id="quotaFill" style="width:0%"></div></div>
      <div id="dashList" style="margin-top:12px"></div>
    </div>
  </div>

  <div id="tab-create" class="tab">
    <div class="card">
      <h2>➕ ساخت کانفیگ جدید پابجی / بازی</h2>
      <div class="row">
        <div><label>روز اعتبار</label><input type="number" id="cfgDays" min="1" max="500" value="500"/></div>
        <div><label>کاربر</label><input type="number" id="cfgUsers" min="1" max="50" value="1"/></div>
        <div><label>حجم (گیگ)</label><input type="number" id="cfgGB" min="1" max="500" value="50"/></div>
      </div>
      <label>نام کانفیگ (اختیاری)</label>
      <input type="text" id="cfgName" placeholder="ZAKI-Gaming-TR"/>
      <div style="margin-top:12px"><button type="button" class="btn btn-p" id="btnCreate">✨ ساخت + دانلود فایل Conf</button></div>
    </div>
  </div>

  <div id="tab-configs" class="tab">
    <div class="card">
      <h2>📂 کانفیگ‌های ساخته‌شده</h2>
      <div id="cfgList"></div>
    </div>
  </div>

  <div id="tab-sub" class="tab">
    <div class="card">
      <h2>🔗 دریافت لینک اشتراک (Subscription)</h2>
      <label>لینک ساب HTTPS</label>
      <input type="text" id="subHttps" readonly placeholder="هنوز ساخته نشده" style="direction:ltr;text-align:left;color:#86efac;font-family:monospace;font-size:0.85rem"/>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
        <button type="button" class="btn btn-p" id="btnSubLatest">🚀 ساخت لینک آخرین کانفیگ</button>
        <button type="button" class="btn btn-o" id="btnCopySub">📋 کپی لینک</button>
        <button type="button" class="btn btn-o" id="btnOpenSub">🌐 باز کردن صفحه ساب</button>
      </div>
      <div id="subCfgList" style="margin-top:14px"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var PANEL = {totalGB: 500, endpoint: "78.135.79.205:30891"};
  var SERVER_PUBLIC_KEY = "4Don/yrIYYdqt1u4LocXfDrLNYo3NbCaV1nPTm2wDmM=";
  var SOURCE_DNS = "95.0.35.45, 8.8.8.8";
  var SOURCE_MTU = 1280;
  var STORAGE_KEY = "wg_panel_zaki_gaming_500gb";
  var CONFIGS = [];
  var CONSUMED = 0;
  var LAST_SUB_URL = "";

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 3000);
  }

  function switchTab(id) {
    document.querySelectorAll(".nav button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === id);
    });
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
    var el = document.getElementById("tab-" + id);
    if (el) el.classList.add("active");
    if (id === "dash") renderDash();
    if (id === "configs") renderList();
    if (id === "sub") renderSub();
  }

  document.querySelectorAll(".nav button").forEach(function(btn){
    btn.addEventListener("click", function(){ switchTab(btn.getAttribute("data-tab")); });
  });

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        CONFIGS = o.configs || [];
        CONSUMED = Number(o.consumedGB) || 0;
        LAST_SUB_URL = o.httpsSubUrl || "";
      } else {
        CONFIGS = [];
        CONSUMED = 0;
        save();
      }
    } catch (e) { CONFIGS = []; CONSUMED = 0; }
    CONFIGS.forEach(function(c){
      if (typeof c.inSub === "undefined") c.inSub = true;
      if (typeof c.usedGB === "undefined") c.usedGB = 0;
    });
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ configs: CONFIGS, consumedGB: CONSUMED, httpsSubUrl: LAST_SUB_URL }));
  }

  function toB64(buf) {
    var b = new Uint8Array(buf), s = "";
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }

  function genKeys() {
    var p = new Uint8Array(32);
    crypto.getRandomValues(p);
    p[0] &= 248; p[31] &= 127; p[31] |= 64;
    return toB64(p);
  }

  function remainingDays(cfg) {
    if (!cfg) return 0;
    var endMs = null;
    if (cfg.expiresAt) endMs = new Date(cfg.expiresAt).getTime();
    else if (cfg.createdAt && cfg.days) endMs = new Date(cfg.createdAt).getTime() + (Number(cfg.days)||0)*86400000;
    else return Number(cfg.days)||0;
    var left = Math.ceil((endMs - Date.now()) / 86400000);
    return left > 0 ? left : 0;
  }

  function isActive(cfg) {
    if (!cfg || cfg.inSub === false) return false;
    if (remainingDays(cfg) <= 0) return false;
    return Math.max(0, (Number(cfg.gb)||0) - (Number(cfg.usedGB)||0)) > 0;
  }

  function buildConf(name, days, gb) {
    var privKey = genKeys();
    var ipAddr = "10.10." + Math.floor(10 + Math.random()*200) + "." + Math.floor(10 + Math.random()*200) + "/32";
    var safe = String(name).replace(/[^\x20-\x7E]/g,"_").slice(0,40);
    var conf = [
      "# 𖤍 ZAKI GAMING · HEADSHOT-MAX · LOW-JITTER",
      "# Name: "+safe,
      "# Volume: "+gb+"GB",
      "# Time: "+days+" days",
      "",
      "[Interface]",
      "PrivateKey = "+privKey,
      "Address = "+ipAddr,
      "DNS = "+SOURCE_DNS,
      "MTU = "+SOURCE_MTU,
      "",
      "[Peer]",
      "PublicKey = "+SERVER_PUBLIC_KEY,
      "AllowedIPs = 0.0.0.0/0",
      "Endpoint = "+PANEL.endpoint,
      "PersistentKeepalive = 10",
      ""
    ].join("\n");
    return { conf: conf, privateKey: privKey };
  }

  function downloadText(text, filename) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){ toast("✅ کپی شد"); }).catch(function(){ fallback(text); });
    else fallback(text);
  }

  function fallback(text) {
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("✅ کپی شد"); } catch(e) { toast("❌ کپی نشد"); }
    document.body.removeChild(ta);
  }

  function updateStatus() {
    var total = Number(PANEL.totalGB)||500;
    var used = Math.max(0, Number(CONSUMED)||0);
    var rem = Math.max(0, total - used);
    var act = CONFIGS.filter(isActive).length;
    document.getElementById("statusMeta").innerHTML =
      "ظرفیت کل پنل: <strong style='color:#f59e0b'>"+total+" GB</strong><br>"+
      "حجم مصرف شده: <strong style='color:#86efac'>"+used+"</strong> / "+total+" GB — باقی‌مانده: <strong>"+rem+"</strong> GB<br>"+
      "کانفیگ‌های فعال: <strong>"+act+"</strong> / "+CONFIGS.length;
    var pct = Math.min(100, Math.round((used/total)*100));
    var fill = document.getElementById("quotaFill");
    fill.style.width = pct+"% ";
    fill.style.background = pct>=95?"#ef4444":pct>=70?"#f59e0b":"#3b82f6";
    var btn = document.getElementById("btnCreate");
    if (btn) btn.disabled = rem <= 0;
  }

  function cfgButtons(cfg, i, on) {
    return '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">'+
      '<button type="button" class="btn '+(cfg.inSub!==false?"btn-d":"btn-s")+'" data-a="toggle" data-i="'+i+'">'+(cfg.inSub!==false?"🔴 غیرفعال":"🟢 فعال")+'</button>'+
      '<button type="button" class="btn btn-p" data-a="dl" data-i="'+i+'"'+(on?"":" disabled")+'>⬇️ دانلود</button>'+
      '<button type="button" class="btn btn-o" data-a="copy" data-i="'+i+'"'+(on?"":" disabled")+'>📋 کپی</button>'+
      '<button type="button" class="btn btn-g" data-a="sub" data-i="'+i+'">🔗 لینک ساب</button>'+
      '<button type="button" class="btn btn-d" data-a="del" data-i="'+i+'">🗑️</button></div>';
  }

  function renderList() {
    updateStatus();
    var list = document.getElementById("cfgList");
    if (!CONFIGS.length) { list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:16px">هنوز کانفیگی ساخته نشده است</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      var left = remainingDays(cfg);
      var st = on ? "فعال (گیمینگ)" : "غیرفعال/منقضی";
      html += '<div class="cfg" style="opacity:'+(on?1:0.55)+'"><strong>🎮 '+(cfg.name||("#"+(i+1)))+'</strong> <span style="font-size:0.75rem;color:'+(on?"#86efac":"#fca5a5")+'">● '+st+'</span><br>'+
        '<span style="font-size:0.82rem;color:var(--muted)">'+(cfg.days||0)+' روز • باقی‌مانده: '+left+' روز • '+(cfg.gb||0)+' گیگ</span>'+cfgButtons(cfg,i,on)+'</div>';
    });
    list.innerHTML = html;
  }

  function renderDash() {
    updateStatus();
    var box = document.getElementById("dashList");
    if (!CONFIGS.length) { box.innerHTML = '<p style="color:var(--muted)">کانفیگی موجود نیست</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      html += '<div class="cfg"><strong>'+(cfg.name||("#"+(i+1)))+'</strong> — '+(on?"فعال":"غیرفعال")+' | '+(cfg.gb||0)+'GB'+
        '<br><button type="button" class="btn btn-g" data-a="sub" data-i="'+i+'" style="margin-top:6px">🔗 دریافت لینک ساب</button></div>';
    });
    box.innerHTML = html;
  }

  function renderSub() {
    updateStatus();
    var el = document.getElementById("subHttps");
    if (el) { el.value = LAST_SUB_URL || ""; el.placeholder = LAST_SUB_URL ? "" : "هنوز ساخته نشده"; }
    var box = document.getElementById("subCfgList");
    if (!CONFIGS.length) { box.innerHTML = '<p style="color:var(--muted)">ابتدا کانفیگ بسازید</p>'; return; }
    var html = '<strong style="color:var(--accent);font-size:0.9rem">لیست لینک‌های اشتراک:</strong>';
    CONFIGS.forEach(function(cfg, i) {
      html += '<div class="cfg"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center">'+
        '<span>'+(cfg.name||("#"+(i+1)))+'</span>'+
        '<button type="button" class="btn btn-g" data-a="sub" data-i="'+i+'">🔗 دریافت لینک ساب</button></div>'+
        (cfg.httpsSubUrl ? '<div style="margin-top:6px;font-size:0.72rem;direction:ltr;text-align:left;color:#86efac;word-break:break-all;font-family:monospace">'+cfg.httpsSubUrl+'</div>' : '')+
        '</div>';
    });
    box.innerHTML = html;
  }

  function buildSubPageHtml(cfg) {
    var on = isActive(cfg);
    var nameStr = String(cfg.name || "ZAKI-Gaming");
    var totalGB = Number(cfg.gb)||0;
    var confData = on ? (cfg.confText || "") : "";
    return '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><title>ساب | '+nameStr.replace(/</g,"")+'</title><style>'+
      'body{font-family:Tahoma;background:#020617;color:#e2e8f0;padding:20px;max-width:420px;margin:0 auto}'+
      '.card{background:#0f172a;border:1px solid #f59e0b;border-radius:12px;padding:16px;margin-bottom:12px}'+
      '.conf{background:#020617;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;direction:ltr;text-align:left;color:#38bdf8;white-space:pre-wrap;word-break:break-all}'+
      '</style></head><body><h2>𖤍 ZAKI GAMING</h2><div class="card"><p>نام: '+nameStr+'</p><p>حجم: '+totalGB+' GB</p></div>'+
      '<div class="conf">'+(confData||"غیرفعال").replace(/</g,"&lt;")+'</div></body></html>';
  }

  async function uploadHtml(bodyHtml) {
    var url = null;
    try {
      var res = await fetch("https://api.pastes.dev/post", { method:"POST", headers:{"Content-Type":"text/html; charset=utf-8"}, body: bodyHtml });
      if (res.ok) { var data = await res.json(); if (data && data.key) url = "https://api.pastes.dev/"+data.key; }
    } catch(e) {}
    return url;
  }

  async function createSubFor(i) {
    var cfg = CONFIGS[i];
    if (!cfg) return;
    toast("⏳ ساخت لینک ساب...");
    var body = buildSubPageHtml(cfg);
    var url = await uploadHtml(body);
    if (url) {
      cfg.httpsSubUrl = url;
      LAST_SUB_URL = url;
      save();
      var el = document.getElementById("subHttps");
      if (el) el.value = url;
      copyText(url);
      toast("✅ لینک ساب ساخته و کپی شد");
      renderSub(); renderDash(); renderList();
    } else {
      window.open(URL.createObjectURL(new Blob([body],{type:"text/html;charset=utf-8"})), "_blank");
      toast("⚠ خطا در هاست آنلاین — صفحه محلی باز شد");
    }
  }

  function createConfig() {
    var total = Number(PANEL.totalGB)||500;
    var rem = Math.max(0, total - (Number(CONSUMED)||0));
    if (rem <= 0) { toast("⛔ حجم پنل تمام شده"); return; }
    var days = parseInt(document.getElementById("cfgDays").value,10)||500;
    var gb = parseInt(document.getElementById("cfgGB").value,10)||50;
    if (gb > rem) { gb = rem; }
    var name = (document.getElementById("cfgName").value||"").trim();
    if (!name) name = "ZAKI-Gaming-"+days+"روزه-"+gb+"گیگ";
    var built = buildConf(name, days, gb);
    CONFIGS.unshift({
      id: "cfg_"+Date.now().toString(36), name: name, days: days, gb: gb, usedGB: 0,
      confText: built.conf, createdAt: new Date().toISOString(), expiresAt: new Date(Date.now()+days*86400000).toISOString(), inSub: true, httpsSubUrl: null
    });
    CONSUMED = (Number(CONSUMED)||0) + gb;
    LAST_SUB_URL = "";
    save();
    renderList(); renderDash(); renderSub();
    downloadText(built.conf, name.replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g,"_")+".conf");
    toast("✅ کانفیگ گیمینگ ساخته و دانلود شد");
    document.getElementById("cfgName").value = "";
    switchTab("configs");
  }

  function handleAction(a, i) {
    var cfg = CONFIGS[i];
    if (!cfg) return;
    if (a === "dl") {
      downloadText(cfg.confText, (cfg.name||"config").replace(/\s+/g,"_")+".conf");
      toast("⬇️ دانلود شد");
    } else if (a === "copy") {
      copyText(cfg.confText||"");
    } else if (a === "toggle") {
      cfg.inSub = !(cfg.inSub !== false);
      save(); renderAll();
      toast(cfg.inSub!==false?"✅ فعال شد":"⏸ غیرفعال شد");
    } else if (a === "del") {
      if (!confirm("حذف کانفیگ؟")) return;
      CONFIGS.splice(i,1); save(); renderAll(); toast("🗑️ حذف شد");
    } else if (a === "sub") {
      createSubFor(i);
    }
  }

  function renderAll() { renderList(); renderDash(); renderSub(); updateStatus(); }

  document.getElementById("btnCreate").addEventListener("click", function(e){ e.preventDefault(); createConfig(); });
  document.getElementById("btnSubLatest").addEventListener("click", function(){ if(!CONFIGS.length){toast("کانفیگی نیست");return;} createSubFor(0); });
  document.getElementById("btnCopySub").addEventListener("click", function(){
    var v = document.getElementById("subHttps").value;
    if (!v) { toast("⚠ ابتدا لینک بسازید"); return; }
    copyText(v);
  });
  document.getElementById("btnOpenSub").addEventListener("click", function(){
    var v = document.getElementById("subHttps").value;
    if (v) window.open(v, "_blank");
    else toast("لینک ساب موجود نیست");
  });

  document.body.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-a]");
    if (!btn || btn.disabled) return;
    handleAction(btn.getAttribute("data-a"), parseInt(btn.getAttribute("data-i"), 10));
  });

  load();
  renderAll();
  toast("پنل گیمینگ ZAKI آماده شد!");
})();
</script>
</body>
</html>
